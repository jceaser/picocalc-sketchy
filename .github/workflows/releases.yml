name: Create Release

on:
  push:
    tags:
      - 'v*.*.*'  # Responds to tag versions like v1.0.0

jobs:
  create_release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Setup tinygo
        uses: tinygo-org/action-tinygo@v0.4.0

      - name: Build Pico
        run: run build -o pico-sketchy.uf2 -target=pico

      - name: Build Pico2
        run: run build -o pico2-sketchy.uf2 -target=pico2

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}
          body: |
            Changes in this release:
            - Your release notes here.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
